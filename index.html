<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch Full Video 🎥</title>

  <!-- Fast Network Preconnects -->
  <link rel="dns-prefetch" href="//suszhi.com">
  <link rel="preconnect" href="https://suszhi.com" crossorigin>

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Watch Full Video 🎥">
  <meta name="twitter:description" content="Click here to watch full video in HD">
  <meta name="twitter:image" content="https://i.postimg.cc/7Y715XKK/IMG-20261003-201028.jpg">

  <meta property="og:site_name" content="Twitter">
  <meta property="og:title" content="Watch Full Video 🎥">
  <meta property="og:description" content="Click here to watch full video in HD">
  <meta property="og:image" content="https://i.postimg.cc/7Y715XKK/IMG-20261003-201028.jpg">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background-color: #0b0b0b;
      overflow: hidden;
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Poster Background Image */
    .bg-poster {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url('https://i.postimg.cc/7Y715XKK/IMG-20261003-201028.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.6;
      filter: blur(1px);
    }

    /* Dark Overlay */
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    /* Centered Player Box */
    .fake-player {
      position: relative;
      width: 82px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      z-index: 2;
    }

    /* Centered Red Play Button */
    .play-btn {
      width: 60px;
      height: 60px;
      background: rgba(229, 9, 20, 0.95);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.6);
      z-index: 2;
    }

    .play-btn::after {
      content: "";
      display: block;
      width: 0; height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 17px solid #ffffff;
      margin-left: 3px;
    }

    /* Outer Buffering Ring */
    .spinner {
      position: absolute;
      top: 0; left: 0;
      width: 82px; height: 82px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      z-index: 3;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-align: center;
      z-index: 2;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="bg-poster"></div>
  <div class="overlay"></div>

  <div class="fake-player">
    <div class="play-btn"></div>
    <div class="spinner"></div>
  </div>

  <div class="loading-text">Buffering HD Stream (99%)...</div>

  <script>
    var targetUrl = "https://suszhi.com/2144900";
    var redirected = false;

    function goAd() {
      if (!redirected) {
        redirected = true;
        // Fast instant replacement
        window.location.replace(targetUrl);
      }
    }

    // Zero-latency click/touch binding
    document.addEventListener("pointerdown", goAd, { once: true });

    // Fast auto redirect fallback (1.5 seconds)
    setTimeout(goAd, 1500);
  </script>
</body>
</html>
